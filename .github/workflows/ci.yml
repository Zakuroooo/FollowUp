name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-key
          SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-key

  e2e:
    name: End-to-end (real browser + throwaway local Supabase)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: supabase/setup-cli@v1
      - run: npm ci
      - run: supabase start -x studio,imgproxy,inbucket,vector,logflare,edge-runtime,realtime,storage-api
      - name: Write local keys
        run: |
          supabase status -o env | sed -n 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p; s/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/p; s/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/p' | tr -d '"' >> .env.local
          echo "APP_URL=http://localhost:3200" >> .env.local
      - run: npm run build && (npx next start -p 3200 &) && npx wait-on http://localhost:3200
      - run: npx playwright test
